<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #171815; }
      .frame { fill: none; stroke: rgba(225, 216, 195, 0.15); stroke-width: 1; }
      .card-dark { fill: #1f211c; stroke: rgba(225, 216, 195, 0.12); stroke-width: 1; rx: 6px; }
      .card-hero { fill: #242720; stroke: #c7a66a; stroke-width: 1.5; rx: 6px; }
      .gold { fill: #c7a66a; }
      .gold-light { fill: #dfc895; }
      .cream { fill: #f0ede5; }
      .muted { fill: #9e9b8f; }
      .dark-text { fill: #171815; }
      
      .main-title { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 26px; font-weight: 600; }
      .card-title { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 21px; font-weight: 600; }
      .tag { font-family: 'DM Sans', -apple-system, sans-serif; font-size: 9px; letter-spacing: 2px; font-weight: 700; text-transform: uppercase; }
      .body-text { font-family: 'DM Sans', -apple-system, sans-serif; font-size: 11.5px; line-height: 1.6; }
      .caption-text { font-family: 'DM Sans', -apple-system, sans-serif; font-size: 10px; letter-spacing: 0.5px; }
      
      .arrow-line { stroke: #c7a66a; stroke-width: 1.5; stroke-dasharray: 4, 3; fill: none; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#c7a66a" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="520" class="bg" />
  <rect x="18" y="18" width="924" height="484" rx="8" class="frame" />

  <!-- Section Header -->
  <text x="50" y="52" class="tag gold">EKOSISTEM DIGITAL SENIMAN VISUAL</text>
  <text x="50" y="84" class="main-title cream">Media Sosial <tspan fill="#dfc895">vs.</tspan> Website Portofolio Mandiri</text>
  <text x="50" y="106" class="body-text muted">Perbedaan peran strategis setiap kanal dalam membangun keberlanjutan karier ilustrator.</text>

  <!-- ==================== COLUMN 1: SOCIAL MEDIA ==================== -->
  <g transform="translate(50, 130)">
    <!-- Card Frame -->
    <rect width="255" height="330" class="card-dark" />
    
    <!-- Header Area -->
    <circle cx="32" cy="38" r="15" fill="#2d3028" stroke="rgba(225,216,195,0.15)" stroke-width="1" />
    <text x="32" y="43" text-anchor="middle" class="gold" font-family="'DM Sans',sans-serif" font-size="12" font-weight="700">01</text>
    
    <text x="58" y="32" class="tag muted">CORONG TRAFFIC</text>
    <text x="58" y="52" class="card-title cream">Media Sosial</text>
    
    <line x1="20" y1="72" x2="235" y2="72" stroke="rgba(225,216,195,0.1)" />

    <!-- Content Items -->
    <text x="22" y="98" class="caption-text gold">Karakteristik &amp; Limitasi:</text>
    <text x="22" y="125" class="body-text cream">• Platform sewaan (rented land)</text>
    <text x="22" y="152" class="body-text cream">• Bergantung fluktuasi algoritma</text>
    <text x="22" y="179" class="body-text cream">• Kompresi gambar agresif</text>
    <text x="22" y="206" class="body-text cream">• Distraksi iklan &amp; video pendek</text>
    <text x="22" y="233" class="body-text cream">• Hak kepemilikan platform</text>

    <!-- Bottom Capsule -->
    <rect x="18" y="260" width="219" height="50" rx="4" fill="#171814" stroke="rgba(225,216,195,0.1)" />
    <text x="127" y="280" text-anchor="middle" class="tag muted">FUNGSI STRATEGIS</text>
    <text x="127" y="297" text-anchor="middle" class="body-text cream" font-weight="600">Menjangkau Audiens Baru</text>
  </g>

  <!-- Connection Line 1 -> 2 -->
  <path d="M 312 295 L 352 295" class="arrow-line" marker-end="url(#arr)" />
  <rect x="313" y="268" width="40" height="16" rx="3" fill="#171815" />
  <text x="333" y="280" text-anchor="middle" class="tag gold" font-size="8">TRAFFIC</text>

  <!-- ==================== COLUMN 2: PORTFOLIO WEBSITE (HERO) ==================== -->
  <g transform="translate(360, 120)">
    <!-- Card Frame (Hero Highlight) -->
    <rect width="270" height="350" class="card-hero" />
    
    <!-- Gold Header Stamp -->
    <circle cx="36" cy="40" r="17" fill="#c7a66a" />
    <text x="36" y="46" text-anchor="middle" class="dark-text" font-family="'DM Sans',sans-serif" font-size="13" font-weight="800">02</text>
    
    <text x="64" y="34" class="tag gold">PANGGUNG UTAMA</text>
    <text x="64" y="56" class="card-title gold-light">Website Mandiri</text>
    
    <line x1="22" y1="76" x2="248" y2="76" stroke="#4a4435" />

    <!-- Content Items -->
    <text x="24" y="103" class="caption-text gold-light">Keunggulan Hakiki:</text>
    <text x="24" y="130" class="body-text cream">✓ Kendali &amp; kedaulatan 100%</text>
    <text x="24" y="157" class="body-text cream">✓ Kurasi fokus tanpa distraksi</text>
    <text x="24" y="184" class="body-text cream">✓ Kualitas karya Hi-Res asli</text>
    <text x="24" y="211" class="body-text cream">✓ Aset SEO pencarian Google</text>
    <text x="24" y="238" class="body-text cream">✓ Standar kurasi klien global</text>

    <!-- Bottom Capsule Highlighted -->
    <rect x="20" y="270" width="230" height="56" rx="4" fill="#1b1c18" stroke="#c7a66a" stroke-width="1" />
    <text x="135" y="291" text-anchor="middle" class="tag gold">RUMAH KREATIF DIGITAL</text>
    <text x="135" y="311" text-anchor="middle" class="body-text cream" font-weight="700">Pusat Reputasi &amp; Konversi</text>
  </g>

  <!-- Connection Line 2 -> 3 -->
  <path d="M 638 295 L 678 295" class="arrow-line" marker-end="url(#arr)" />
  <rect x="638" y="268" width="40" height="16" rx="3" fill="#171815" />
  <text x="658" y="280" text-anchor="middle" class="tag gold" font-size="8">KONTRAK</text>

  <!-- ==================== COLUMN 3: RESULTS / OPPORTUNITY ==================== -->
  <g transform="translate(685, 130)">
    <!-- Card Frame -->
    <rect width="225" height="330" class="card-dark" />
    
    <!-- Header Area -->
    <circle cx="32" cy="38" r="15" fill="#2d3028" stroke="rgba(225,216,195,0.15)" stroke-width="1" />
    <text x="32" y="43" text-anchor="middle" class="gold" font-family="'DM Sans',sans-serif" font-size="12" font-weight="700">03</text>
    
    <text x="58" y="32" class="tag muted">HASIL AKHIR</text>
    <text x="58" y="52" class="card-title cream">Karier &amp; Klien</text>
    
    <line x1="20" y1="72" x2="205" y2="72" stroke="rgba(225,216,195,0.1)" />

    <!-- Content Items -->
    <text x="20" y="98" class="caption-text gold">Dampak Nyata:</text>
    <text x="20" y="125" class="body-text cream">• Art Director &amp; Publisher</text>
    <text x="20" y="152" class="body-text cream">• Kontrak komisi resmi</text>
    <text x="20" y="179" class="body-text cream">• Lisensi hak cipta karya</text>
    <text x="20" y="206" class="body-text cream">• Nilai komersial lebih tinggi</text>
    <text x="20" y="233" class="body-text cream">• Hubungan klien jangka panjang</text>

    <!-- Bottom Capsule -->
    <rect x="16" y="260" width="193" height="50" rx="4" fill="#171814" stroke="rgba(225,216,195,0.1)" />
    <text x="112" y="280" text-anchor="middle" class="tag muted">DAMPAK</text>
    <text x="112" y="297" text-anchor="middle" class="body-text cream" font-weight="600">Karier Mandiri Berkelanjutan</text>
  </g>
</svg>
